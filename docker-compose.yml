services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: caregrid
    ports:
      - "${APP_PORT}:80"
    depends_on:
      - api
    environment:
      API_URL: "${API_URL}"

  api:
    image: node:latest
    working_dir: /app
    ports:
      - "${API_PORT}:3001"
    command: sh -c "npm install -g json-server && json-server --host 0.0.0.0 --port 3001 db.json"
    volumes:
      - ./db.json:/app/db.json
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://api:3001"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:18.1-bookworm
    container_name: postgres
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: "${PGADMIN_EMAIL}"
      PGADMIN_DEFAULT_PASSWORD: "${PGADMIN_PASSWORD}"
    ports:
      - "15432:80"
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data:
